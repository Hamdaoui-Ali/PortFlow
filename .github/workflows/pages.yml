name: Publish PortFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python tooling
        run: python -m pip install uv

      - name: Install locked dependencies
        run: |
          python -m uv sync --extra dev --frozen
          npm --prefix web ci

      - name: Verify deterministic snapshot
        run: |
          python -m uv run python scripts/generate_first_snapshot.py
          git diff --exit-code -- web/public/data

      - name: Run quality gate and Pages build
        shell: pwsh
        env:
          VITE_BASE_PATH: /PortFlow/
        run: |
          ./scripts/verify.ps1
          npm --prefix web run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
