name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTFLOW_POSTGRES_PASSWORD: ${{ github.run_id }}
      PORTFLOW_DATABASE_URL: postgresql://portflow:${{ github.run_id }}@localhost:5432/portflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portflow
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: portflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portflow -d portflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python tooling
        run: "python -m pip install --only-binary=:all: uv==0.12.12"

      - name: Install locked dependencies
        run: |
          python -m uv sync --extra dev --extra orchestration --frozen
          npm --prefix web ci --ignore-scripts

      - name: Run complete R2 quality gate
        shell: pwsh
        run: ./scripts/verify_r2.ps1
