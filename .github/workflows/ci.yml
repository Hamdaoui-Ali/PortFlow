name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORTFLOW_DATABASE_URL: postgresql://portflow:portflow@localhost:5432/portflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portflow
          POSTGRES_PASSWORD: portflow
          POSTGRES_DB: portflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portflow -d portflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python tooling
        run: python -m pip install uv

      - name: Install locked dependencies
        run: |
          python -m uv sync --extra dev --frozen
          npm --prefix web ci

      - name: Run R2 quality gate
        shell: pwsh
        run: ./scripts/verify_r2.ps1
