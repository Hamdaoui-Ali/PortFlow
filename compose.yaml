services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: "${PORTFLOW_POSTGRES_PASSWORD:?Set PORTFLOW_POSTGRES_PASSWORD before starting PostgreSQL}"
      POSTGRES_DB: portflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  redpanda:
    profiles: ["streaming"]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --overprovisioned
      - --smp
      - "1"
      - --reserve-memory
      - "0M"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
  portflow-metrics:
    profiles: ["observability"]
    image: python:3.12-alpine
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      PORTFLOW_STREAM_STATE_PATH: /var/lib/portflow/.stream-state.sqlite3
    command: ["python", "-m", "portflow.observability.server", "--host", "0.0.0.0", "--port", "9108"]
    volumes:
      - ./src:/workspace/src:ro
      - ./data/bronze-stream:/var/lib/portflow:ro
    ports:
      - "127.0.0.1:9108:9108"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9108/metrics"]
      interval: 5s
      timeout: 5s
      retries: 20
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      portflow-metrics:
        condition: service_healthy
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${PORTFLOW_GRAFANA_ADMIN_PASSWORD-}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus_data:
  grafana_data:
